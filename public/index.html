<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Siliccontest · Simulacro licencia San Isidro</title>
  <meta name="description" content="Simulacro del examen teórico para la licencia de conducir de San Isidro.">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="logo.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand-logo-btn" data-go="inicio" type="button" aria-label="Ir al inicio">
        <img class="brand-logo" src="logo.svg" width="36" height="36" alt="">
      </button>
      <button class="brand" data-go="inicio" type="button">
        <span class="brand-text">
          <span class="brand-name">Siliccontest</span>
          <span class="brand-sub">Simulacro de examen teórico</span>
        </span>
      </button>
      <nav>
        <button class="navlink" data-go="inicio" type="button">Nuevo examen</button>
        <button class="navlink" data-go="historial" type="button">Historial</button>
      </nav>
    </div>
  </header>

  <main id="app" class="container"></main>

  <footer class="foot container">
    Preguntas elaboradas a partir del Manual de Educación Vial de San Isidro (edición marzo 2026).
    <span id="storage-mode"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
